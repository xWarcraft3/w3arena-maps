<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W3Arena Map Database</title>
<meta name="description" content="Community-maintained W3Arena Warcraft III map database.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080a0d;
  --panel:#0d1116;
  --panel2:#11161d;
  --line:#252c35;
  --text:#edf2f7;
  --muted:#8b96a3;
  --accent:#d8e0e8;
  --accent2:#7d8b99;
  --green:#5ee6a8;
  --danger:#ff6b6b;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.07),transparent 35%),
    linear-gradient(180deg,#0a0c10 0%,var(--bg) 42%,#07090c 100%);
  color:var(--text);
  font-family:Rajdhani,Arial,sans-serif;
  min-height:100vh;
}
body:before{
  content:"";
  position:fixed; inset:0; pointer-events:none; opacity:.28;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:38px 38px;
  mask-image:linear-gradient(to bottom,black,transparent 75%);
}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto}

header{
  padding:42px 0 28px;
  border-bottom:1px solid var(--line);
  text-align:center;
}
.brand-mark{
  width:76px;height:76px;margin:0 auto 15px;
  border:1px solid #48515c;border-radius:18px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#171d24,#090c10);
  box-shadow:0 10px 35px rgba(0,0,0,.45),inset 0 0 25px rgba(255,255,255,.035);
  overflow:hidden;
}
.brand-mark img{width:62px;height:62px;object-fit:contain}
.brand-fallback{
  font-family:"Share Tech Mono",monospace;
  font-size:18px;font-weight:bold;letter-spacing:-1px;
}
.brand-name{
  font-size:30px;font-weight:700;letter-spacing:.14em;
}
.kicker{
  margin-top:5px;color:var(--muted);
  font:12px "Share Tech Mono",monospace;letter-spacing:.14em;
}

.hero{padding:58px 0 28px}
.eyebrow{
  color:var(--accent2);
  font:12px "Share Tech Mono",monospace;
  letter-spacing:.18em;margin-bottom:12px;
}
h1{
  margin:0;font-size:clamp(38px,7vw,72px);
  line-height:.9;letter-spacing:.025em;
  text-transform:uppercase;
}
.hero p{
  max-width:720px;color:#aeb7c1;
  font-size:17px;line-height:1.55;margin:20px 0 18px;
}
.hero .sub{font-size:14px;color:#6f7a86;margin-top:-8px}
.download{
  display:inline-flex;align-items:center;gap:9px;
  margin-top:4px;padding:10px 15px;
  border:1px solid #39434e;border-radius:7px;
  text-decoration:none;color:#e8edf2;
  font-weight:600;letter-spacing:.04em;
  background:#10151b;transition:.2s;
}
.download:hover{border-color:#697684;background:#171d24;transform:translateY(-1px)}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin:20px 0 28px;
}
.stat{
  background:rgba(13,17,22,.82);border:1px solid var(--line);
  padding:16px 18px;border-radius:8px;
}
.stat .num{font:24px "Share Tech Mono",monospace}
.stat .label{
  color:#737f8b;font:10px "Share Tech Mono",monospace;
  letter-spacing:.14em;margin-top:4px;
}

.toolbar{
  display:flex;gap:10px;align-items:center;
  margin-bottom:12px;
}
.search{
  flex:1;min-width:0;
  background:#0d1217;border:1px solid var(--line);
  color:var(--text);border-radius:7px;
  padding:13px 14px;outline:none;
  font:15px Rajdhani,Arial,sans-serif;
}
.search:focus{border-color:#596674;box-shadow:0 0 0 3px rgba(120,135,150,.08)}
select{
  width:190px;background:#0d1217;color:#dce3e9;
  border:1px solid var(--line);border-radius:7px;
  padding:12px;font:14px Rajdhani,Arial,sans-serif;
}

.table-shell{
  border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:rgba(13,17,22,.88);
  box-shadow:var(--shadow);
}
.table-head,.row{
  display:grid;grid-template-columns:150px minmax(0,1fr) 190px;
  align-items:center;
}
.table-head{
  background:#11161c;color:#6f7b87;
  font:10px "Share Tech Mono",monospace;
  letter-spacing:.15em;padding:12px 18px;
  border-bottom:1px solid var(--line);
}
.row{
  min-height:62px;padding:0 18px;border-bottom:1px solid #1b2128;
}
.row:last-child{border-bottom:0}
.row:hover{background:#11171d}
.id{font-family:"Share Tech Mono",monospace;color:#9aa6b2;font-size:13px}
.map-link{text-decoration:none;color:#edf2f7;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.map-link:hover{text-decoration:underline;text-underline-offset:3px}
.map-name{overflow:hidden}
.no-link{color:#a8b1ba;font-size:16px;font-weight:600}
.status{
  justify-self:start;
  display:inline-flex;align-items:center;gap:8px;
  color:var(--green);font:11px "Share Tech Mono",monospace;
  letter-spacing:.08em;
}
.status:before{
  content:"";width:7px;height:7px;border-radius:50%;
  background:var(--green);box-shadow:0 0 9px var(--green);
}
.status.incompatible,.status.unavailable,.status.outdated{color:var(--danger)}
.status.incompatible:before,.status.unavailable:before,.status.outdated:before{
  background:var(--danger);box-shadow:0 0 9px var(--danger)
}
.status.unknown{color:#c5ccd3}
.status.unknown:before{background:#8a949e;box-shadow:none}

.empty{
  padding:42px 20px;text-align:center;color:#707b86;
  font:12px "Share Tech Mono",monospace;letter-spacing:.08em;
}
.pagination{
  display:flex;align-items:center;justify-content:center;
  gap:12px;padding:20px 0 42px;
}
.page-btn{
  border:1px solid var(--line);background:#0d1217;color:#dce3e9;
  border-radius:6px;padding:9px 14px;cursor:pointer;
  font:13px "Share Tech Mono",monospace;
}
.page-btn:hover:not(:disabled){background:#161c23;border-color:#596674}
.page-btn:disabled{opacity:.35;cursor:not-allowed}
.page-info{color:#7d8791;font:11px "Share Tech Mono",monospace;min-width:120px;text-align:center}

footer{
  border-top:1px solid var(--line);padding:22px 0 30px;
  color:#626d78;font:11px "Share Tech Mono",monospace;
  text-align:center;line-height:1.7;
}
.loading{padding:45px 20px;text-align:center;color:#77828d;font:12px "Share Tech Mono",monospace}
.error{
  margin:0 0 22px;padding:14px;border:1px solid #4b2b2b;
  background:#171011;color:#ff9b9b;border-radius:7px;
  font:12px "Share Tech Mono",monospace;line-height:1.5;
}

@media(max-width:700px){
  .wrap{width:min(100% - 20px,1120px)}
  header{padding-top:28px}
  .hero{padding-top:42px}
  .stats{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  .search,select{width:100%}
  .table-head{display:none}
  .row{
    grid-template-columns:1fr;
    gap:8px;padding:15px 16px;min-height:0;
  }
  .status{margin-top:3px}
}
</style>
</head>

<body>
<header>
  <div class="table-shell">
    <div class="table-head">
      <div>MAP ID</div>
      <div>MAP NAME</div>
    </div>
    <div id="mapRows">
      <div class="loading">LOADING MAP DATABASE...</div>
    </div>
  </div>

  <div class="pagination">
    <button id="prevBtn" class="page-btn" disabled>← PREVIOUS</button>
    <div id="pageInfo" class="page-info">PAGE — / —</div>
    <button id="nextBtn" class="page-btn" disabled>NEXT →</button>
  </div>
</main>

<footer>
  <div class="wrap">
    W3ARENA MAP DATABASE<br>
    <span style="color:#4a5461;">Community-maintained directory. Not an official W3Arena website.</span>
  </div>
</footer>

<script>
// CONFIGURATION
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzHAX39BWa3jCNzkimbCijP0Jh80B5lgmz6VGnrWjDxZ5ei_WvOti7UjHgvEueDEXXB/exec",
  ITEMS_PER_PAGE: 15
};

let allMaps = [];
let filteredMaps = [];
let currentPage = 1;

// DOM ELEMENTS
const mapRows = document.getElementById('mapRows');
const errorBox = document.getElementById('errorBox');
const searchInput = document.getElementById('search');
const totalMapsEl = document.getElementById('totalMaps');
const totalLinksEl = document.getElementById('totalLinks');
const showingEl = document.getElementById('showing');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInfo = document.getElementById('pageInfo');

// FETCH DATA FROM GOOGLE SHEETS
async function loadDatabase() {
  try {
    const response = await fetch(CONFIG.API_URL);
    if (!response.ok) throw new Error("Network connection response failed");
    
    const data = await response.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error("Invalid or empty data returned");

    // Map rows ignoring any missing status properties completely
    allMaps = data.map(item => ({
      id: item.map_id || "—",
      name: item.map_name || "Untitled Map"
    })).filter(item => item.id !== "—" || item.name !== "Untitled Map");

    filteredMaps = [...allMaps];
    updateStats();
    renderPage();
    setupEventListeners();
  } catch (err) {
    console.error(err);
    errorBox.textContent = "Could not load the Google Sheet data. Check that the Apps Script Web App is deployed for public access and that CONFIG.API_URL is correct.";
    errorBox.hidden = false;
    mapRows.innerHTML = '<div class="empty">DATABASE CONNECTION ERROR</div>';
  }
}

function updateStats() {
  totalMapsEl.textContent = allMaps.length;
  totalLinksEl.textContent = "0"; // Removed status column tracking
  showingEl.textContent = filteredMaps.length;
}

function renderPage() {
  const totalPages = Math.ceil(filteredMaps.length / CONFIG.ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * CONFIG.ITEMS_PER_PAGE;
  const end = start + CONFIG.ITEMS_PER_PAGE;
  const pageItems = filteredMaps.slice(start, end);

  if (pageItems.length === 0) {
    mapRows.innerHTML = '<div class="empty">NO MATCHING MAPS FOUND</div>';
    pageInfo.textContent = `PAGE ${currentPage} / ${totalPages}`;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  // Generate clean 2-column layout row blocks dynamically
  mapRows.innerHTML = pageItems.map(map => `
    <div class="row" style="grid-template-columns: 150px minmax(0, 1fr);">
      <div class="id">${map.id}</div>
      <div class="map-name">
        <span class="no-link">${map.name}</span>
      </div>
    </div>
  `).join('');

  pageInfo.textContent = `PAGE ${currentPage} / ${totalPages}`;
  prevBtn.disabled = currentPage === 1;
  nextBtn.disabled = currentPage === totalPages;
}

function setupEventListeners() {
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    filteredMaps = allMaps.filter(map => 
      map.id.toString().toLowerCase().includes(term) || 
      map.name.toLowerCase().includes(term)
    );
    currentPage = 1;
    showingEl.textContent = filteredMaps.length;
    renderPage();
  });

  prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderPage(); } };
  nextBtn.onclick = () => { if (currentPage < Math.ceil(filteredMaps.length / CONFIG.ITEMS_PER_PAGE)) { currentPage++; renderPage(); } };
}

// Initializing loader execution block
if (CONFIG.API_URL && CONFIG.API_URL !== "https://script.google.com/macros/s/AKfycbzHAX39BWa3jCNzkimbCijP0Jh80B5lgmz6VGnrWjDxZ5ei_WvOti7UjHgvEueDEXXB/exec") {
  loadDatabase();
} else {
  errorBox.textContent = "Please set your deployed Google Apps Script URL string inside the CONFIG object configuration block.";
  errorBox.hidden = false;
}
</script>
</body>
</html>
